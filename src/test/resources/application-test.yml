spring:
  ai:
    model:
      # Replace Ollama with deterministic fakes (see FakeAiConfiguration) so tests are hermetic.
      chat: none
      embedding: none

app:
  jwt:
    # Fresh random key per test context (64 hex chars = valid base64, 48 bytes).
    secret: ${random.value}${random.value}
  chunking:
    max-chars: 400
    overlap-chars: 60

logging:
  level:
    org.apache.kafka: warn
    io.github.snipperxx.docintel: debug
