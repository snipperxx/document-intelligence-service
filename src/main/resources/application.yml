spring:
  application:
    name: docintel
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docintel}
    username: ${DB_USER:docintel}
    password: ${DB_PASSWORD:docintel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      # One record per poll: extraction of a large document can take minutes, and the consumer
      # must poll again within max.poll.interval.ms or it is kicked out of the group.
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 900000

  http:
    clients:
      # Fail fast when Ollama is unreachable, but give slow local generation time to finish.
      connect-timeout: 5s
      read-timeout: 5m

  ai:
    retry:
      # Spring AI defaults to 10 attempts with up to 3 min backoff, which can park a
      # document in PROCESSING for over 20 minutes when the model server is down.
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3.5:4b}
        temperature: 0.0
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        # Flyway owns the table (V2__vector_store.sql).
        initialize-schema: false
        dimensions: 768
        distance-type: cosine-distance
        index-type: hnsw

app:
  jwt:
    # Development key only. Production must set JWT_SECRET (base64, >= 32 bytes).
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    issuer: docintel
    ttl: 1h
  kafka:
    document-uploaded-topic: documents.uploaded
    partitions: 3
  chunking:
    max-chars: 1500
    overlap-chars: 200
  search:
    default-top-k: 5
    max-top-k: 20

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
